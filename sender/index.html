<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Broadcaster</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, Segoe UI, Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
  .card { width: min(520px, 92vw); background: #1e293b; padding: 28px; border-radius: 16px;
          box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  h1 { margin: 0 0 20px; font-size: 1.4rem; }
  input[type=file], input[type=password] { width: 100%; padding: 10px; background: #0f172a; color: inherit;
          border: 1px solid #334155; border-radius: 8px; margin-bottom: 14px; }
  .media { width: 100%; max-height: 260px; object-fit: contain; border-radius: 8px;
           margin-bottom: 14px; display: none; background: #000; }
  button { width: 100%; padding: 14px; font-size: 1.1rem; font-weight: 700; letter-spacing: .08em;
           border: 0; border-radius: 10px; background: #22c55e; color: #052e16; cursor: pointer; }
  button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
  progress { width: 100%; margin-top: 14px; display: none; }
  #status { margin-top: 12px; min-height: 1.4em; font-size: .95rem; }
  .ok { color: #4ade80; } .err { color: #f87171; }
</style>
</head>
<body>
<div class="card">
  <h1>📡 Media Broadcaster</h1>
  <input type="password" id="password" placeholder="Sender password" autocomplete="current-password">
  <input type="file" id="file" accept="image/*,video/*,.mkv,.avi,.mov">
  <img id="ipreview" class="media" alt="Preview">
  <video id="vpreview" class="media" controls muted></video>
  <button id="send" disabled>SEND</button>
  <progress id="bar" max="100" value="0"></progress>
  <div id="status"></div>
</div>

<script type="module">
import { upload } from 'https://esm.sh/@vercel/blob@1/client';

const $ = (id) => document.getElementById(id);
const fileEl = $('file'), pwEl = $('password'), sendBtn = $('send');
const bar = $('bar'), statusEl = $('status');

const IMAGE_EXT = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif',
                    bmp: 'image/bmp', webp: 'image/webp' };
const VIDEO_EXT = { mp4: 'video/mp4', mkv: 'video/x-matroska', avi: 'video/x-msvideo',
                    mov: 'video/quicktime', webm: 'video/webm' };

pwEl.value = sessionStorage.getItem('pw') || '';
const setStatus = (m, c = '') => { statusEl.textContent = m; statusEl.className = c; };
const extOf = (n) => n.split('.').pop().toLowerCase();
const refresh = () => { sendBtn.disabled = !(fileEl.files[0] && pwEl.value); };

fileEl.addEventListener('change', () => {
  $('ipreview').style.display = $('vpreview').style.display = 'none';
  setStatus('');
  const f = fileEl.files[0];
  if (f) {
    const url = URL.createObjectURL(f);
    const e = extOf(f.name);
    if (e in IMAGE_EXT) { $('ipreview').src = url; $('ipreview').style.display = 'block'; }
    else if (e in VIDEO_EXT) { $('vpreview').src = url; $('vpreview').style.display = 'block'; }
  }
  refresh();
});
pwEl.addEventListener('input', refresh);

sendBtn.addEventListener('click', async () => {
  const f = fileEl.files[0];
  const password = pwEl.value;
  const ext = extOf(f.name);
  const contentType = IMAGE_EXT[ext] || VIDEO_EXT[ext];
  if (!contentType) return setStatus('✖ Unsupported file type: .' + ext, 'err');
  const type = ext in IMAGE_EXT ? 'image' : 'video';

  sendBtn.disabled = true; bar.value = 0; bar.style.display = 'block';
  setStatus('Uploading…');
  try {
    const blob = await upload(f.name, f, {
      access: 'public',
      handleUploadUrl: '/api/upload',
      clientPayload: password,
      contentType,
      multipart: true,                       // chunked upload: handles very large files
      onUploadProgress: ({ percentage }) => { bar.value = percentage; },
    });

    setStatus('Broadcasting…');
    const r = await fetch('/api/broadcast', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password, url: blob.url, filename: f.name, type }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Broadcast failed (' + r.status + ')');

    sessionStorage.setItem('pw', password);
    setStatus('✔ Sent to all receivers: ' + f.name, 'ok');
  } catch (err) {
    setStatus('✖ ' + err.message, 'err');
  } finally {
    bar.style.display = 'none';
    refresh();
  }
});
</script>
</body>
</html>
