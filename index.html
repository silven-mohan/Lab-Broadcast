<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Broadcaster</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, Segoe UI, Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
  .card { width: min(520px, 92vw); background: #1e293b; padding: 28px; border-radius: 16px;
          box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  h1 { margin: 0 0 20px; font-size: 1.4rem; }
  input[type=file], input[type=password] { width: 100%; padding: 10px; background: #0f172a; color: inherit;
          border: 1px solid #334155; border-radius: 8px; margin-bottom: 14px; }
  #preview { width: 100%; max-height: 260px; object-fit: contain; border-radius: 8px;
             margin-bottom: 14px; display: none; background: #000; }
  button { width: 100%; padding: 14px; font-size: 1.1rem; font-weight: 700; letter-spacing: .08em;
           border: 0; border-radius: 10px; background: #22c55e; color: #052e16; cursor: pointer; }
  button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
  progress { width: 100%; margin-top: 14px; display: none; }
  #status { margin-top: 12px; min-height: 1.4em; font-size: .95rem; }
  .ok { color: #4ade80; } .err { color: #f87171; }
</style>
</head>
<body>
<div class="card">
  <h1>📡 Media Broadcaster</h1>
  <input type="file" id="file" accept="image/*,video/*,.mkv,.avi,.mov">
  {% if token_required %}<input type="password" id="token" placeholder="Access token">{% endif %}
  <img id="preview" alt="Preview">
  <video id="vpreview" style="display:none;width:100%;max-height:260px;border-radius:8px;margin-bottom:14px" controls muted></video>
  <button id="send" disabled>SEND</button>
  <progress id="bar" max="100" value="0"></progress>
  <div id="status"></div>
</div>
<script>
const fileEl = document.getElementById('file');
const sendBtn = document.getElementById('send');
const img = document.getElementById('preview');
const vid = document.getElementById('vpreview');
const bar = document.getElementById('bar');
const statusEl = document.getElementById('status');
const tokenEl = document.getElementById('token');

function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ''; }

fileEl.addEventListener('change', () => {
  const f = fileEl.files[0];
  img.style.display = vid.style.display = 'none';
  sendBtn.disabled = !f;
  setStatus('');
  if (!f) return;
  const url = URL.createObjectURL(f);
  if (f.type.startsWith('image/')) { img.src = url; img.style.display = 'block'; }
  else if (f.type.startsWith('video/')) { vid.src = url; vid.style.display = 'block'; }
});

sendBtn.addEventListener('click', () => {
  const f = fileEl.files[0];
  if (!f) return;
  const fd = new FormData();
  fd.append('file', f);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/upload');
  if (tokenEl) xhr.setRequestHeader('X-Token', tokenEl.value);
  xhr.upload.onprogress = e => { if (e.lengthComputable) bar.value = (e.loaded / e.total) * 100; };
  xhr.onload = () => {
    bar.style.display = 'none'; sendBtn.disabled = false;
    let data = {}; try { data = JSON.parse(xhr.responseText); } catch (_) {}
    if (xhr.status === 200) setStatus('✔ Sent to all receivers: ' + data.filename, 'ok');
    else setStatus('✖ ' + (data.error || 'Upload failed (' + xhr.status + ')'), 'err');
  };
  xhr.onerror = () => { bar.style.display = 'none'; sendBtn.disabled = false; setStatus('✖ Network error', 'err'); };
  bar.value = 0; bar.style.display = 'block'; sendBtn.disabled = true;
  setStatus('Uploading…');
  xhr.send(fd);
});
</script>
</body>
</html>
